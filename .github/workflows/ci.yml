name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify third-party notices
        run: |
          npm run notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt

      - name: Scan release files
        run: npm run scan:release

      - name: Check Markdown links
        run: npm run docs:check

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build Chrome
        run: npx wxt build -b chrome
