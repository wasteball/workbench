name: Sync release notes

on:
  push:
    branches:
      - main
    paths:
      - 'docs/release-notes-*.md'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Update existing GitHub releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          shopt -s nullglob
          for notes in docs/release-notes-*.md; do
            version="${notes#docs/release-notes-}"
            version="${version%.md}"
            tag="v${version}"
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              gh release edit "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --notes-file "$notes"
            fi
          done
