name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Use Node.js 24
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Verify tag and release notes
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v${package_version}"
          test -f "docs/release-notes-${package_version}.md"

      - name: Install dependencies
        run: npm ci

      - name: Verify third-party notices
        run: |
          npm run notices
          git diff --exit-code -- THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.txt

      - name: Run release gates
        run: |
          npm run scan:release
          npm run docs:check
          npm run lint
          npm run check
          npm test

      - name: Build Safari resources
        run: npm run build:safari

      - name: Build release packages
        shell: bash
        run: |
          npm run zip:chrome
          npm run zip:edge
          package_version="$(node -p "require('./package.json').version")"
          file_base="workbench-browser-extension-${package_version}"
          cd .output
          sha256sum "${file_base}-chrome.zip" "${file_base}-edge.zip" > SHA256SUMS.txt

      - name: Verify documented checksums
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          notes="docs/release-notes-${package_version}.md"
          while read -r checksum filename; do
            grep -Fq "\`${checksum}\`" "$notes"
            grep -Fq "\`${filename}\`" "$notes"
          done < .output/SHA256SUMS.txt

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          file_base="workbench-browser-extension-${package_version}"
          gh release create "$GITHUB_REF_NAME" \
            ".output/${file_base}-chrome.zip" \
            ".output/${file_base}-edge.zip" \
            .output/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "Workbench ${package_version}" \
            --notes-file "docs/release-notes-${package_version}.md" \
            --prerelease \
            --verify-tag
